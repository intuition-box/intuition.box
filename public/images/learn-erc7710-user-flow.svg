<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="860" height="300" rx="10" fill="#f6f7f9"/>
  <text x="28" y="34" font-size="16" font-weight="700" fill="#0f172a">Support / oppose a claim — every action</text>
  <text x="28" y="54" font-size="12" fill="#64748b">The saved delegation is redeemed by the relayer. The user signs nothing and pays no gas.</text>

  <g font-size="12">
    <!-- User -->
    <rect x="28" y="88" width="120" height="64" rx="8" fill="#eef2ff" stroke="#334155"/>
    <text x="88" y="116" text-anchor="middle" font-weight="700" fill="#0f172a">User</text>
    <text x="88" y="134" text-anchor="middle" fill="#475569">clicks Support</text>

    <!-- Frontend -->
    <rect x="196" y="88" width="130" height="64" rx="8" fill="#fff" stroke="#334155"/>
    <text x="261" y="112" text-anchor="middle" font-weight="700" fill="#0f172a">Frontend</text>
    <text x="261" y="130" text-anchor="middle" fill="#475569">POST /api/stake</text>
    <text x="261" y="146" text-anchor="middle" fill="#475569">+ delegation</text>

    <!-- Relayer -->
    <rect x="374" y="88" width="130" height="64" rx="8" fill="#fff" stroke="#334155"/>
    <text x="439" y="112" text-anchor="middle" font-weight="700" fill="#0f172a">Relayer</text>
    <text x="439" y="130" text-anchor="middle" fill="#475569">admin wallet</text>
    <text x="439" y="146" text-anchor="middle" fill="#475569">pays gas</text>

    <!-- DelegationManager -->
    <rect x="552" y="88" width="140" height="64" rx="8" fill="#fff" stroke="#334155"/>
    <text x="622" y="108" text-anchor="middle" font-weight="700" fill="#0f172a">Delegation</text>
    <text x="622" y="124" text-anchor="middle" font-weight="700" fill="#0f172a">Manager</text>
    <text x="622" y="142" text-anchor="middle" fill="#475569">checks caveats</text>

    <!-- MultiVault -->
    <rect x="740" y="88" width="96" height="64" rx="8" fill="#ecfdf5" stroke="#334155"/>
    <text x="788" y="112" text-anchor="middle" font-weight="700" fill="#0f172a">MultiVault</text>
    <text x="788" y="130" text-anchor="middle" fill="#475569">deposit()</text>
    <text x="788" y="146" text-anchor="middle" fill="#475569">receiver=EOA</text>
  </g>

  <!-- forward connectors -->
  <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow2)">
    <line x1="148" y1="120" x2="194" y2="120"/>
    <line x1="326" y1="120" x2="372" y2="120"/>
    <line x1="504" y1="120" x2="550" y2="120"/>
    <line x1="692" y1="120" x2="738" y2="120"/>
  </g>

  <!-- return: shares credited to the user's EOA -->
  <path d="M788 152 V 214 H 88 V 152" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <rect x="360" y="200" width="200" height="26" rx="6" fill="#f6f7f9"/>
  <text x="460" y="218" text-anchor="middle" font-size="12" fill="#475569">vault shares credited to the user's EOA</text>

  <text x="28" y="268" font-size="11" fill="#64748b">Caveats guarantee: MultiVault target only · deposit() only · daily TRUST cap · receiver locked to the user.</text>
</svg>
